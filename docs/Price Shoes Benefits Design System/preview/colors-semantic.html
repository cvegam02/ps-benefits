<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;font-family:Montserrat,sans-serif}.card{padding:20px;background:#fff;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;font-size:11px;font-weight:600;border:1px solid}.dot{width:8px;height:8px;border-radius:9999px}.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.15em;color:#9ca3af;margin-top:8px}</style>
</head><body><div class="card">
<div><div class="tag" style="background:#fffbeb;color:#b45309;border-color:#fde68a"><span class="dot" style="background:#fbbf24"></span>Pendiente</div><span class="lbl">amber-400</span></div>
<div><div class="tag" style="background:#eff6ff;color:#1e3a8a;border-color:#bfdbfe"><span class="dot" style="background:#1e3a8a"></span>Listo</div><span class="lbl">blue-900</span></div>
<div><div class="tag" style="background:#ecfdf5;color:#047857;border-color:#d1fae5"><span class="dot" style="background:#10b981"></span>Entregado</div><span class="lbl">emerald-500</span></div>
<div><div class="tag" style="background:#fef2f2;color:#dc2626;border-color:#fee2e2"><span class="dot" style="background:#ef4444"></span>Error</div><span class="lbl">red-500</span></div>
</div></body></html>

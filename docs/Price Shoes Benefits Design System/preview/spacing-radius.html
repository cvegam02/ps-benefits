<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0}.card{padding:20px;background:#fff;font-family:Montserrat,sans-serif;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.box{background:#1e3a8a;width:80px;height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700}.lbl{font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.15em;margin-top:6px;text-align:center}</style>
</head><body><div class="card">
<div><div class="box" style="border-radius:6px">6</div><div class="lbl">sm</div></div>
<div><div class="box" style="border-radius:12px">12</div><div class="lbl">md</div></div>
<div><div class="box" style="border-radius:16px">16</div><div class="lbl">lg</div></div>
<div><div class="box" style="border-radius:20px">20</div><div class="lbl">xl</div></div>
<div><div class="box" style="border-radius:24px">24</div><div class="lbl">2xl</div></div>
<div><div class="box" style="border-radius:32px">32</div><div class="lbl">3xl</div></div>
<div><div class="box" style="border-radius:40px">40</div><div class="lbl">4xl</div></div>
<div><div class="box" style="border-radius:9999px">∞</div><div class="lbl">pill</div></div>
</div></body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:#fff}.card{padding:24px;background:#fff;font-family:Montserrat,sans-serif;display:flex;flex-direction:column;gap:14px;max-width:380px}.lbl{font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.15em;margin-bottom:6px;margin-left:4px}.input{position:relative}.input input{width:100%;padding:14px 16px 14px 44px;border-radius:16px;background:#f9fafb;border:1px solid #f3f4f6;font-family:inherit;font-size:13px;outline:none;box-sizing:border-box;font-weight:500}.input.focus input{background:#fff;border:2px solid #3b82f6;padding:13px 16px 13px 43px;box-shadow:0 0 0 4px rgba(59,130,246,.1)}.icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#9ca3af}.input.focus .icon{color:#2563eb}</style>
</head><body><div class="card">
<div><div class="lbl">Correo electrónico</div><div class="input"><span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span><input value="carlos@test.com"></div></div>
<div><div class="lbl">Contraseña</div><div class="input focus"><span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span><input type="password" value="••••••"></div></div>
</div></body></html>

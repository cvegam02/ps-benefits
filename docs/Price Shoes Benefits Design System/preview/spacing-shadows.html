<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:#f9fafb}.card{padding:24px 20px;background:#f9fafb;font-family:Montserrat,sans-serif;display:flex;align-items:center;gap:24px;flex-wrap:wrap}.box{width:80px;height:80px;background:#fff;display:flex;align-items:center;justify-content:center;color:#1e3a8a;font-size:10px;font-weight:700}.lbl{font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.15em;margin-top:8px;text-align:center}</style>
</head><body><div class="card">
<div><div class="box" style="border-radius:24px;box-shadow:0 1px 2px rgba(0,0,0,.05)">sm</div><div class="lbl">card resting</div></div>
<div><div class="box" style="border-radius:24px;box-shadow:0 4px 12px rgba(0,0,0,.06)">md</div><div class="lbl">card hover</div></div>
<div><div class="box" style="border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.12)">xl</div><div class="lbl">floating</div></div>
<div><div class="box" style="border-radius:16px;background:#1e3a8a;color:#fff;box-shadow:0 8px 24px rgba(30,58,138,.25)">blue</div><div class="lbl">cta-blue</div></div>
<div><div class="box" style="border-radius:16px;background:#db2777;color:#fff;box-shadow:0 8px 24px rgba(219,39,119,.25)">pink</div><div class="lbl">cta-pink</div></div>
</div></body></html>

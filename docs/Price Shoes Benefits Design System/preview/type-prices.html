<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0}.card{padding:24px;background:#fff;font-family:Montserrat,sans-serif;display:flex;align-items:center;gap:32px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:4px}.over{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:#db2777}.price{font-weight:900;letter-spacing:-.04em;color:#1e3a8a;font-variant-numeric:tabular-nums;line-height:1}.strike{color:#9ca3af;text-decoration:line-through;font-weight:500;font-size:14px}</style>
</head><body><div class="card">
<div class="col"><span class="over">CALZADO</span><div style="display:flex;align-items:baseline;gap:8px"><span class="price" style="font-size:28px">$619</span><span class="strike">$619</span></div></div>
<div class="col"><span class="over">ROPA</span><div style="display:flex;align-items:baseline;gap:8px"><span class="price" style="font-size:28px">$2,589</span><span class="strike">$3,699</span></div></div>
<div class="col"><span class="over">TOTAL</span><span class="price" style="font-size:32px">$11,200</span></div>
</div></body></html>
